<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https://api.github.com https://api.chub.ai; img-src https:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Link Vault</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f6f4ff;--card:#fff;--ink:#1f1b2e;--mute:#7a7692;--line:#e8e4f7;--acc:#7c5cff;--acc2:#ff6fae;--star:#ffb400;--off:#d9d4ee;--sh:0 8px 28px rgba(90,70,170,.10);--inp:#faf9ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--card:#1e1a2f;--ink:#f1eefc;--mute:#9d98b8;--line:#2e2946;--off:#3a3558;--sh:0 8px 28px rgba(0,0,0,.4);--inp:#171428}}
:root[data-theme="dark"]{--bg:#14121f;--card:#1e1a2f;--ink:#f1eefc;--mute:#9d98b8;--line:#2e2946;--off:#3a3558;--sh:0 8px 28px rgba(0,0,0,.4);--inp:#171428}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;background:radial-gradient(900px 420px at 8% -8%,rgba(124,92,255,.20),transparent),radial-gradient(700px 360px at 100% 0,rgba(255,111,174,.15),transparent),var(--bg);background-color:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding:30px 18px 50px}
h1{margin:0;font-size:32px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);margin:2px 0 22px}
h2{margin:0 0 4px;font-size:18px}
.nav{display:flex;gap:6px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);margin-bottom:18px}
.nav button{flex:1;border:0;background:transparent;color:var(--mute);font:600 14px inherit;font-family:inherit;padding:10px 8px;border-radius:12px;cursor:pointer;transition:.15s}
.nav button:hover{color:var(--ink)}
.nav button.on{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 4px 14px rgba(124,92,255,.35)}
.nav i,.pill i,.chip i{font-style:normal;opacity:.7;font-weight:500;margin-left:4px}
.pills{display:flex;gap:8px;margin-bottom:14px}
.pill,.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px inherit;font-family:inherit;padding:8px 14px;border-radius:999px;cursor:pointer;transition:.15s}
.pill.on,.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.chip{padding:10px 16px;font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:16px}
.row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.row.between{align-items:center;justify-content:space-between;margin:0}
input,select{font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,92,255,.18)}
.row input{flex:1 1 220px}
.primary{border:0;color:#fff;font:700 14px inherit;font-family:inherit;padding:11px 20px;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 4px 14px rgba(124,92,255,.3);transition:.15s;text-decoration:none;display:inline-block}
.primary:hover{transform:translateY(-1px)}.primary:disabled{opacity:.6;cursor:default;transform:none}
.roll{font-size:16px;padding:13px 28px}
.tools{display:flex;gap:10px;margin-bottom:12px}.tools input{flex:1}
.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh);transition:.15s}
.card:hover{transform:translateY(-1px)}
.av{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 70% 58%),hsl(calc(var(--h) + 40) 75% 62%))}
.mid{flex:1;min-width:0}
.t{display:block;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t:hover{color:var(--acc)}
.h{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{display:flex;gap:1px;margin-top:3px}
.st{border:0;background:none;padding:0 1px;font-size:19px;line-height:1;color:var(--off);cursor:pointer;transition:.1s}
.st.on{color:var(--star)}.st:hover{transform:scale(1.2)}
.stars.big .st{font-size:28px}
.act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mini{border:1px solid var(--line);background:var(--inp);color:var(--mute);font:600 12px inherit;font-family:inherit;padding:5px 10px;border-radius:9px;cursor:pointer}
.mini:hover{color:var(--ink)}.mini.danger{background:#ff4d6d;border-color:#ff4d6d;color:#fff}
.empty{text-align:center;color:var(--mute);padding:34px 10px;border:1.5px dashed var(--line);border-radius:16px}
.lbl{color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:6px 2px}
#res .card{animation:pop .25s ease;padding:18px}#res .av{width:56px;height:56px;font-size:24px}
#res .t{font-size:18px}.go{margin-top:6px}
@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:none;opacity:1}}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:26px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s}
#toast.show{opacity:1}
.note{color:var(--mute);font-size:13px;margin:8px 2px 12px}.err{color:#ff4d6d;font-weight:600;margin-top:12px;min-height:1em}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
[hidden]{display:none!important}
.av{position:relative;overflow:hidden;cursor:pointer}.av img{object-position:center top;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#modal,#addm{position:fixed;inset:0;z-index:9;background:rgba(10,8,20,.55);display:grid;place-items:center;padding:18px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(420px,100%);box-shadow:var(--sh)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔗 Link Vault</h1>
  <div class="sub">Your personal collection of characters &amp; creators.</div>
  <div id="gate"></div>
  <div id="appbody" hidden>
    <div class="nav" id="nav"></div>
    <div id="view"></div>
    <div class="foot"><div id="bmbox" class="panel" hidden style="text-align:left;margin:0 0 14px">
      <div class="note" style="margin-top:0"><b>1.</b> Drag this button up to your bookmarks bar: <a id="bmlink" href="#" class="primary" style="padding:6px 12px;font-size:13px;margin-left:4px">＋ Link Vault</a><br><b>2.</b> On any Janitor character or creator page, click that bookmark.<br><b>3.</b> Check the name and picture, then press Add.</div>
      <button class="mini" id="bmcopy">Can’t drag it? Copy it instead</button></div><div id="status"></div><div style="margin-top:10px"><button class="mini" id="bm">Janitor bookmarklet</button> <button class="mini" id="lock">Lock now</button> <button class="mini" id="forget">Forget this device</button></div></div>
  </div>
</div>
<div id="modal" hidden><div class="mbox"><h2 style="margin-bottom:12px">Edit</h2>
  <div class="row"><input id="en" placeholder="Name" autocomplete="off"></div>
  <div class="row"><input id="ei" placeholder="Image address (https://…)" autocomplete="off" spellcheck="false"></div>
  <div class="row"><button class="mini" id="rmimg">Remove picture</button></div>
  <div class="row between" style="margin-top:6px"><button class="mini" id="ecancel">Cancel</button><button class="primary" id="esave">Save</button></div>
</div></div>
<div id="addm" hidden><div class="mbox"><h2 style="margin-bottom:10px">Add to Link Vault</h2>
  <div class="card" id="aprev" style="margin:0 0 12px;box-shadow:none"></div>
  <div class="row"><input id="an" placeholder="Name" autocomplete="off"></div>
  <div class="chips" id="asec" style="margin:4px 0 10px"></div>
  <div class="stars big" id="astars" style="margin-bottom:14px"></div>
  <div class="row between"><button class="mini" id="acancel">Cancel</button><button class="primary" id="aok">Add</button></div>
</div></div>
<div id="toast"></div>
<script>
(function(){
const LS='linkvault.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const NAMES={'characters:current':'Characters · Current','characters:favorite':'Characters · Favorite','creators':'Creators'};
let S={items:[],updated:0};
const ui={tab:'characters',sub:'current',sel:new Set(Object.keys(NAMES)),q:'',sort:'new',ns:0,pick:null,del:null,msg:''};
const bucket=i=>i.sec==='characters'?'characters:'+i.sub:'creators';
const curBucket=()=>ui.tab==='characters'?'characters:'+ui.sub:'creators';
const count=b=>S.items.filter(i=>bucket(i)===b).length;
const find=id=>S.items.find(i=>i.id===id);
const safe=u=>/^https?:\/\//i.test(u)?esc(u):'#';
const title=i=>i.title||host(i.url);
const sorters={new:(a,b)=>b.added-a.added,stars:(a,b)=>b.stars-a.stars||b.added-a.added,name:(a,b)=>title(a).localeCompare(title(b))};

/* ===== CORE-START: encryption + GitHub storage ===== */
const enc=new TextEncoder(),dec=new TextDecoder();
const ITER=1000000,PAD=4096;
const st={repo:'',token:'',key:null,salt:'',iter:ITER,sha:'',canWrite:false,file:null};
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function derive(pass,salt,iter){
  const m=await crypto.subtle.importKey('raw',enc.encode(pass.normalize('NFKC')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-512',salt,iterations:iter},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encB(key,bytes,a){
  const iv=rnd(12);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:enc.encode(a)},key,bytes));
  return b64(iv)+'.'+b64(ct);
}
async function decB(key,s,a){
  const p=s.split('.');
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p[0]),additionalData:enc.encode(a)},key,unb64(p[1])));
}
const hdr=f=>'lv1|'+f.iter+'|'+f.salt;
function pad(obj){ // pad to 4 KB blocks so the file size doesn't reveal how many links you have
  const p=enc.encode(JSON.stringify(obj)),n=Math.ceil((p.length+1)/PAD)*PAD,o=new Uint8Array(n).fill(32);
  o.set(p);return o;
}
async function sealFile(obj){
  const f={v:1,kdf:'PBKDF2-SHA512',iter:st.iter,salt:st.salt};
  f.data=await encB(st.key,pad(obj),hdr(f));
  if(st.token)f.tok=await encB(st.key,enc.encode(st.token),'lv-token'); // GitHub token, encrypted with the same passphrase key
  return f;
}
async function openFile(f,key){
  if(!f||f.v!==1||!f.data||!f.salt||!(f.iter>=600000&&f.iter<=10000000))throw new Error('bad file');
  const d=JSON.parse(dec.decode(await decB(key,f.data,hdr(f))));
  return {items:Array.isArray(d.items)?d.items:[],updated:+d.updated||0};
}
const GH=(path,o)=>fetch('https://api.github.com/repos/'+st.repo+'/contents/'+path,Object.assign({},o,{headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',Authorization:'Bearer '+st.token,'Content-Type':'application/json'}}));
async function fetchRemote(){
  const r=await GH('vault.json',{cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json(),f=JSON.parse(atob(j.content.replace(/\s/g,'')));
  if(f.salt!==st.salt)throw new Error('different vault');
  return {sha:j.sha,data:await openFile(f,st.key)};
}
let dirty=false,timer=null,saving=Promise.resolve();
const stat=t=>{const s=$('#status');if(s)s.textContent=t};
function save(){
  S.updated=Date.now();
  if(!st.canWrite)return;
  dirty=true;stat('Saving…');clearTimeout(timer);
  timer=setTimeout(()=>{saving=saving.then(push)},600);
}
async function push(){
  if(!st.canWrite||!st.key)return;
  for(let n=0;n<3;n++){
    try{
      const body={message:'vault update',content:btoa(JSON.stringify(await sealFile(S)))};
      if(st.sha)body.sha=st.sha;
      const r=await GH('vault.json',{method:'PUT',body:JSON.stringify(body)});
      if(r.ok){st.sha=(await r.json()).content.sha;dirty=false;stat('Encrypted & saved to GitHub ✓');return}
      if(r.status===409||r.status===422){ // changed on another device: merge, then retry
        const rem=await fetchRemote();
        if(rem){const have=new Set(S.items.map(i=>i.id));rem.data.items.forEach(i=>{if(!have.has(i.id))S.items.push(i)});st.sha=rem.sha;render();continue}
      }
      throw new Error('GitHub '+r.status);
    }catch(e){break}
  }
  stat('⚠️ Couldn’t save to GitHub — it will retry on your next change');
}
/* ===== CORE-END ===== */

/* ---------- views ---------- */
const stars=(n,id)=>[1,2,3,4,5].map(k=>`<button class="st${k<=n?' on':''}" data-star="${k}" data-id="${id}" aria-label="${k} star${k>1?'s':''}">★</button>`).join('');
function card(i){
  const h=host(i.url),isC=i.sec==='characters';
  return `<article class="card"><div class="av" data-edit="${i.id}" title="Click to edit name &amp; picture" style="--h:${hue(h)}">${esc(title(i)[0].toUpperCase())}${/^https:\/\//.test(i.img||'')?`<img src="${esc(i.img)}" alt="" referrerpolicy="no-referrer" loading="lazy">`:''}</div>
  <div class="mid"><a class="t" href="${safe(i.url)}" target="_blank" rel="noopener noreferrer">${esc(title(i))}</a><div class="h">${esc(h)}</div><div class="stars">${stars(i.stars,i.id)}</div></div>
  <div class="act">${isC?`<button class="mini" data-move="${i.id}">${i.sub==='current'?'♥ Favorite':'↩ Current'}</button>`:''}
  <button class="mini" data-edit="${i.id}">Edit</button>
  <button class="mini${ui.del===i.id?' danger':''}" data-del="${i.id}">${ui.del===i.id?'Sure?':'Delete'}</button></div></article>`;
}
function renderNav(){
  $('#nav').innerHTML=[['characters','Characters',count('characters:current')+count('characters:favorite')],['creators','Creators',count('creators')],['random','🎲 Random','']]
    .map(([k,l,n])=>`<button data-tab="${k}" class="${ui.tab===k?'on':''}">${l}${n!==''?`<i>${n}</i>`:''}</button>`).join('');
}
function renderPills(){
  const p=$('#pills');if(!p)return;
  p.innerHTML=['current','favorite'].map(s=>`<button class="pill${ui.sub===s?' on':''}" data-sub="${s}">${s==='current'?'Current':'Favorite'}<i>${count('characters:'+s)}</i></button>`).join('');
}
function renderList(){
  const el=$('#list');if(!el)return;
  const q=ui.q.toLowerCase(),b=curBucket();
  const rows=S.items.filter(i=>bucket(i)===b&&(!q||(i.title+' '+i.url).toLowerCase().includes(q))).sort(sorters[ui.sort]);
  el.innerHTML=rows.length?rows.map(card).join(''):`<div class="empty">${q?'No matches.':'Nothing here yet — paste a link above.'}</div>`;
}
function renderBrowse(){
  const isC=ui.tab==='characters';
  $('#view').innerHTML=`${isC?'<div class="pills" id="pills"></div>':''}
  <section class="panel">
    <div class="row"><input id="u" placeholder="Paste a Chub or Janitor link…" autocomplete="off" autocapitalize="off" spellcheck="false"><input id="n" placeholder="Name (optional — overrides the automatic one)" autocomplete="off"></div>
    <div class="row between"><div class="stars big" id="ns">${stars(ui.ns,'new')}</div><button class="primary" id="add">Add to ${NAMES[curBucket()]}</button></div>
  </section>
  <div class="tools"><input id="q" placeholder="Search…" value="${esc(ui.q)}"><select id="so"><option value="new">Newest</option><option value="stars">Top rated</option><option value="name">A–Z</option></select></div>
  <div id="list"></div>`;
  $('#so').value=ui.sort;
  renderPills();renderList();
}
const resHtml=()=>{
  const it=find(ui.pick);
  if(ui.msg)return `<div class="empty">${esc(ui.msg)}</div>`;
  if(!it)return '<div class="empty">Hit Roll to get a surprise link ✨</div>';
  return `<div class="lbl">${NAMES[bucket(it)]}</div>${card(it)}<a class="primary go" href="${safe(it.url)}" target="_blank" rel="noopener noreferrer">Open link ↗</a>`;
};
const showRes=()=>{const r=$('#res');if(r)r.innerHTML=resHtml()};
function renderRandom(){
  $('#view').innerHTML=`<section class="panel"><h2>Random pick</h2><div style="color:var(--mute)">Choose where to pull from — select one or several.</div>
  <div class="chips">${Object.keys(NAMES).map(k=>`<button class="chip${ui.sel.has(k)?' on':''}" data-sel="${k}">${NAMES[k]}<i>${count(k)}</i></button>`).join('')}</div>
  <button class="primary roll" id="roll">🎲 Roll</button></section><div id="res">${resHtml()}</div>`;
}
function render(){renderNav();ui.tab==='random'?renderRandom():renderBrowse()}
const refresh=()=>ui.tab==='random'?showRes():renderList();

/* ---------- actions ---------- */
let toastT;
function flash(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
function fixUrl(v){
  v=v.trim();if(!v)return null;
  if(!/^https?:\/\//i.test(v))v='https://'+v;
  try{const u=new URL(v);return /^https?:$/.test(u.protocol)&&u.hostname.includes('.')?u.href:null}catch(e){return null}
}
const titleCase=t=>t.replace(/[-_]+/g,' ').trim().replace(/\b\w/g,c=>c.toUpperCase());
function parseLink(url){
  let u;try{u=new URL(url)}catch(e){return {}}
  const h=u.hostname.replace(/^www\./,''),p=u.pathname.split('/').filter(Boolean);
  if(h==='chub.ai'||h.endsWith('.chub.ai')){
    if(p[0]==='characters'&&p.length>=3)return {site:'chub',kind:'char',path:p[1]+'/'+p[2],name:titleCase(p[2].replace(/-(?=[a-z0-9]*\d)(?=[a-z0-9]*[a-z])[a-z0-9]{8,}$/i,''))};
    if(p[0]==='users'&&p[1])return {site:'chub',kind:'user',path:p[1],name:p[1]};
    return {site:'chub'};
  }
  if(h==='janitorai.com'||h.endsWith('.janitorai.com')){
    const m=(p[1]||'').match(/^[0-9a-f-]{36}_(?:character-)?(.+)$/i);
    return {site:'janitor',name:p[0]==='characters'&&m?titleCase(m[1]):''};
  }
  return {};
}
async function chubLookup(L){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch('https://api.chub.ai/api/'+(L.kind==='char'?'characters/':'users/')+L.path,{headers:{Accept:'application/json'},signal:ctl.signal});
    if(!r.ok)return null;
    const j=await r.json(),n=j.node||j.user||j;
    const name=String(n.name||n.display_name||n.username||'');
    const img=String(n.avatar_url||n.max_res_url||n.profile_image||n.avatar||n.image||'');
    return name||img?{name,img:/^https:\/\//.test(img)?img:''}:null;
  }finally{clearTimeout(t)}
}
async function add(){
  if(!st.canWrite){flash('Read-only on this device — unlock with a GitHub token to save');return}
  const url=fixUrl($('#u').value);
  if(!url){flash('Please enter a valid link');return}
  const isC=ui.tab==='characters',L=parseLink(url),typed=$('#n').value.trim();
  const it={id:uid(),url,title:typed||L.name||'',auto:!typed,img:'',sec:ui.tab,sub:isC?ui.sub:'',stars:ui.ns,added:Date.now()};
  S.items.unshift(it);save();
  $('#u').value='';$('#n').value='';ui.ns=0;$('#ns').innerHTML=stars(0,'new');
  renderList();renderNav();renderPills();$('#u').focus();
  if(L.site==='chub'&&L.kind){
    flash('Looking it up on Chub…');
    try{
      const r=await chubLookup(L);
      if(r){if(it.auto&&r.name)it.title=r.name;if(r.img)it.img=r.img;save();refresh();flash('Added ✓')}
      else flash('Added — Chub had nothing for that link. Click the picture to edit.');
    }catch(e){flash('Added — couldn’t reach Chub. Click the picture to edit.')}
  }else if(L.site==='janitor')flash('Added — Janitor needs a login, so click the picture to set its image.');
}
/* ---------- edit name & picture ---------- */
const okImg=u=>!u||/^https:\/\//.test(u);
function openEdit(id){
  const i=find(id);if(!i)return;
  ui.edit=id;ui.eimg=/^https:\/\//.test(i.img||'')?i.img:'';
  $('#en').value=i.title||'';$('#ei').value=ui.eimg;
  $('#ei').placeholder='Image address (https://…)';
  $('#modal').hidden=false;$('#en').focus();
}
const closeEdit=()=>{ui.edit=null;$('#modal').hidden=true};
function saveEdit(){
  const i=find(ui.edit);if(!i)return closeEdit();
  if(!okImg(ui.eimg)){flash('Image address must start with https://');return}
  i.img=ui.eimg;i.title=$('#en').value.trim();i.auto=false;
  save();closeEdit();refresh();
}
function roll(){
  ui.msg='';
  const pool=S.items.filter(i=>ui.sel.has(bucket(i)));
  if(!ui.sel.size||!pool.length){ui.pick=null;ui.msg=!ui.sel.size?'Select at least one section first.':'Nothing saved in the selected sections yet.';return showRes()}
  const cand=pool.length>1?pool.filter(i=>i.id!==ui.pick):pool;
  const win=cand[Math.floor(Math.random()*cand.length)],btn=$('#roll');
  let n=0;btn.disabled=true;
  const t=setInterval(()=>{
    if(++n>=8){clearInterval(t);ui.pick=win.id;btn.disabled=false}
    else ui.pick=pool[Math.floor(Math.random()*pool.length)].id;
    showRes();
  },70);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-tab],[data-sub],[data-star],[data-move],[data-del],[data-sel],[data-edit],#add,#roll,#go,#gen,#lock,#forget,#rmimg,#esave,#ecancel,[data-asec],#aok,#acancel,#bm,#bmcopy,#bmlink');
  if(!b)return;const d=b.dataset;
  if(!st.canWrite&&(d.star||d.move||d.del||d.edit||b.id==='add'||b.id==='esave')&&b.id!=='go'){flash('Read-only on this device — unlock with a GitHub token to save');return}
  if(d.tab){ui.tab=d.tab;ui.q='';ui.del=null;render()}
  else if(d.sub){ui.sub=d.sub;render()}
  else if(d.star){
    const k=+d.star;
    if(d.id==='anew'){ui.add.stars=ui.add.stars===k?0:k;$('#astars').innerHTML=stars(ui.add.stars,'anew')}
    else if(d.id==='new'){ui.ns=ui.ns===k?0:k;$('#ns').innerHTML=stars(ui.ns,'new')}
    else{const it=find(d.id);if(it){it.stars=it.stars===k?0:k;save();refresh()}}
  }
  else if(d.move){const it=find(d.move);if(it){it.sub=it.sub==='current'?'favorite':'current';save();renderList();renderPills();flash('Moved to '+(it.sub==='current'?'Current':'Favorite'))}}
  else if(d.del){
    if(ui.del===d.del){S.items=S.items.filter(i=>i.id!==d.del);ui.del=null;save();refresh();renderNav();renderPills()}
    else{const id=d.del;ui.del=id;refresh();setTimeout(()=>{if(ui.del===id){ui.del=null;refresh()}},2500)}
  }
  else if(d.sel){ui.sel.has(d.sel)?ui.sel.delete(d.sel):ui.sel.add(d.sel);renderRandom()}
  else if(b.id==='add')add();
  else if(b.id==='roll')roll();
  else if(d.asec){ui.add.k=d.asec;renderAdd()}
  else if(b.id==='aok')commitAdd();
  else if(b.id==='acancel')closeAdd();
  else if(b.id==='bm'){const x=$('#bmbox');x.hidden=!x.hidden;if(!x.hidden)$('#bmlink').href=bmCode()}
  else if(b.id==='bmlink'){e.preventDefault();flash('Drag it to your bookmarks bar — don’t click it here')}
  else if(b.id==='bmcopy'){const c=bmCode();(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>flash('Copied — paste it as the address of a new bookmark'),()=>flash('Couldn’t copy automatically'))}
  else if(d.edit)openEdit(d.edit);
  else if(b.id==='esave')saveEdit();
  else if(b.id==='ecancel')closeEdit();
  else if(b.id==='rmimg'){ui.eimg='';$('#ei').value='';$('#ei').placeholder='Image address (https://…)'}
  else if(b.id==='go')ui.mode==='create'?create():unlock();
  else if(b.id==='gen')$('#pw').value=gen();
  else if(b.id==='lock')lock();
  else if(b.id==='forget'){localStorage.removeItem('lv.tok');localStorage.removeItem('lv.repo');location.reload()}
});
document.addEventListener('input',e=>{if(e.target.id==='ei')ui.eimg=e.target.value.trim();if(e.target.id==='q'){ui.q=e.target.value;renderList()}});
document.addEventListener('change',e=>{if(e.target.id==='so'){ui.sort=e.target.value;renderList()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.add)closeAdd();else if(ui.edit)closeEdit()}if(e.key==='Enter'&&e.target.id==='an')commitAdd();if(e.key==='Enter'&&['pw','tok','repo'].includes(e.target.id))ui.mode==='create'?create():unlock();if(e.key==='Enter'&&(e.target.id==='u'||e.target.id==='n'))add()});

/* ---------- Janitor bookmarklet: receive + confirm ---------- */
let pendingAdd=null;
const okSite=u=>{try{const x=new URL(u);return x.protocol==='https:'&&/(^|\.)(janitorai\.com|chub\.ai)$/.test(x.hostname)}catch(e){return false}};
const trustedImg=u=>/^https:\/\/([\w-]+\.)*(janitorai\.com|charhub\.io|chub\.ai)\//.test(u||'');
const sameUrl=(a,b)=>{try{const x=new URL(a),y=new URL(b),f=u=>u.origin+u.pathname.replace(/\/$/,'');return f(x)===f(y)}catch(e){return false}};
function readHash(){ // the bookmarklet hands data over in the #fragment, which never leaves your browser
  const h=location.hash||'';
  if(h.indexOf('#add=')===0){try{pendingAdd=JSON.parse(decodeURIComponent(h.slice(5)))}catch(e){}}
  if(h.indexOf('#add=')===0||h==='#adding')history.replaceState(null,'',location.pathname+location.search);
}
function showAdd(){
  const p=pendingAdd;pendingAdd=null;
  if(!p)return;
  if(!okSite(p.u)){flash('Ignored an add request from an unknown site');return}
  if(!st.canWrite){flash('Read-only on this device — unlock with a GitHub token to add links');return}
  const L=parseLink(p.u),isU=p.t==='u';
  ui.add={u:p.u,img:trustedImg(p.i)?p.i:'',k:isU?'creators':'characters:current',stars:0,ex:S.items.find(i=>sameUrl(i.url,p.u))||null};
  $('#an').value=String(p.n||L.name||'').slice(0,120);
  renderAdd();$('#addm').hidden=false;$('#aok').focus();
}
function renderAdd(){
  const a=ui.add,h=host(a.u),nm=$('#an').value||h;
  $('#aprev').innerHTML=`<div class="av" style="--h:${hue(h)};cursor:default">${esc(nm[0].toUpperCase())}${a.img?`<img src="${esc(a.img)}" alt="" referrerpolicy="no-referrer">`:''}</div><div class="mid"><div class="t">${esc(h)}</div><div class="h">${a.ex?'Already saved — this will update it':'New link'}${a.img?'':' · no picture found'}</div></div>`;
  $('#asec').innerHTML=Object.keys(NAMES).map(k=>`<button class="chip${a.k===k?' on':''}" data-asec="${k}">${NAMES[k]}</button>`).join('');
  $('#astars').innerHTML=stars(a.stars,'anew');
  $('#aok').textContent=a.ex?'Update':'Add';
}
const closeAdd=()=>{ui.add=null;$('#addm').hidden=true};
function commitAdd(){
  const a=ui.add;if(!a)return;
  const name=$('#an').value.trim(),sec=a.k==='creators'?'creators':'characters',sub=sec==='creators'?'':a.k.split(':')[1];
  let it=a.ex;
  if(it){it.title=name||it.title;if(a.img)it.img=a.img;it.sec=sec;it.sub=sub;if(a.stars)it.stars=a.stars;it.auto=false}
  else{it={id:uid(),url:a.u,title:name,auto:false,img:a.img,sec,sub,stars:a.stars,added:Date.now()};S.items.unshift(it)}
  save();closeAdd();
  ui.tab=sec;if(sec==='characters')ui.sub=sub;ui.q='';render();flash('Saved ✓');
}
/* The bookmarklet itself. It is written as a normal function so it can be turned into the bookmark text. */
function lvBookmarklet(BASE){
  return (async function(){
    var P=location.pathname,isU=/^\/profiles\//.test(P),isC=/^\/characters\//.test(P);
    if(!isU&&!isC){alert('Open a Janitor character or creator page first.');return}
    var w=window.open(BASE+'#adding','linkvault');
    if(!w){alert('Pop-up blocked. Allow pop-ups for this site, then click the bookmark again.');return}
    try{
      var q=function(s){return document.querySelector(s)};
      var meta=function(n){var e=q('meta[property="'+n+'"]');return e?e.content:''};
      var name='',img='',a=q('img.avatar-image');
      if(isC&&a){name=a.alt||'';img=a.src}
      if(isC&&!name){var h=q('h2.chakra-heading');if(h)name=h.textContent.trim()}
      if(!name)name=(meta('og:title')||document.title).replace(/^janitor\s*-\s*/i,'').trim();
      if(!img){var best=0;document.querySelectorAll('main img').forEach(function(i){if(/janitorai\.com/.test(i.src)&&!/logo|star|hotlink-ok|media-approved/.test(i.src)&&i.naturalWidth>best){best=i.naturalWidth;img=i.src}})}
      if(!img)img=meta('og:image');
      if(img)img=img.replace(/([?&])width=\d+/,'$1width=400');
      w.location.href=BASE+'#add='+encodeURIComponent(JSON.stringify({u:location.origin+P,n:name,i:img,t:isU?'u':'c'}));
    }catch(e){alert('Link Vault bookmarklet error: '+e.message)}
  })();
}
const bmCode=()=>'javascript:'+encodeURIComponent('('+lvBookmarklet.toString()+')('+JSON.stringify(location.origin+location.pathname)+')');

/* ---------- lock screen ---------- */
const gate=h=>{$('#gate').innerHTML=h};
const gerr=m=>{const e=$('#err');if(e)e.textContent=m};
const busy=on=>{const b=$('#go');if(b){b.disabled=on;b.textContent=on?'Working…':(ui.mode==='create'?'Create vault':'Unlock')}};
const repoOk=r=>/^[\w.-]+\/[\w.-]+$/.test(r);
function detectRepo(){
  const m=location.hostname.match(/^(.+)\.github\.io$/i);if(!m)return '';
  const seg=location.pathname.split('/')[1];
  return m[1]+'/'+(seg&&!seg.includes('.')?seg:m[1]+'.github.io');
}
function gen(){ // 25 chars from a 31-letter alphabet ≈ 124 bits of randomness
  const A='abcdefghjkmnpqrstuvwxyz23456789',o=[];
  while(o.length<25)for(const x of rnd(32))if(x<248&&o.length<25)o.push(A[x%31]);
  return o.join('').match(/.{5}/g).join('-');
}
function showCreate(){
  ui.mode='create';
  gate(`<section class="panel"><h2>Create your encrypted vault</h2>
  <div class="note">Everything is encrypted in this page (AES-256) before it goes to your GitHub repo. Your passphrase never leaves this device. Your token is stored in the vault too (encrypted the same way), so any device only needs the passphrase.</div>
  <div class="row"><input id="repo" placeholder="GitHub repo (owner/name)" value="${esc(st.repo)}" autocomplete="off" spellcheck="false"></div>
  <div class="row"><input id="tok" type="password" placeholder="GitHub token (this repo only · Contents: read &amp; write)" autocomplete="off"></div>
  <div class="row"><input id="pw" class="mono" value="${esc(gen())}" autocomplete="off" spellcheck="false"><button class="mini" id="gen">New</button></div>
  <div class="note">⚠️ That’s your passphrase (or type your own, 14+ characters). Save it in a password manager now — it can’t be recovered or reset.</div>
  <button class="primary" id="go">Create vault</button><div class="err" id="err"></div></section>`);
}
function showUnlock(){
  ui.mode='unlock';
  const has=!!localStorage.getItem('lv.tok')||!!(st.file&&st.file.tok);
  gate(`<section class="panel"><h2>🔒 Unlock</h2>${pendingAdd?`<div class="note" style="margin-top:0">📎 Unlock to add “${esc(String(pendingAdd.n||"this link").slice(0,80))}”.</div>`:''}
  <div class="row"><input id="pw" type="password" placeholder="Passphrase" autocomplete="current-password"></div>
  ${has&&repoOk(st.repo)?'':`<div class="row"><input id="repo" placeholder="GitHub repo (owner/name)" value="${esc(st.repo)}" autocomplete="off" spellcheck="false"></div>`}
  ${has?'':`<div class="note">Optional: add a GitHub token to save changes from this device. Without one it opens read-only.</div>`}
  <div class="row"><input id="tok" type="password" placeholder="${has?'New GitHub token (leave blank to use the saved one)':'GitHub token (optional)'}" autocomplete="off"></div>
  <button class="primary" id="go">Unlock</button><div class="err" id="err"></div></section>`);
  $('#pw').focus();
}
async function boot(){
  gate('<section class="panel"><div class="note">Checking…</div></section>');
  try{
    const r=await fetch('vault.json',{cache:'no-store'});
    if(r.ok){const f=await r.json();if(f&&f.v===1&&f.data&&f.salt){st.file=f;return showUnlock()}}
  }catch(e){}
  if(localStorage.getItem('lv.tok'))gate('<section class="panel"><h2>Almost there</h2><div class="note">Your vault is saved in GitHub, but GitHub Pages is still publishing it. Reload this page in a minute or two.</div></section>');
  else showCreate();
}
async function unlock(){
  const pass=$('#pw').value;if(!pass)return;
  busy(true);gerr('');
  try{
    const f=st.file;
    st.salt=f.salt;st.iter=f.iter;
    const key=await derive(pass,unb64(f.salt),f.iter);
    let data;try{data=await openFile(f,key)}catch(e){gerr('Wrong passphrase.');return}
    st.key=key;S=data;st.canWrite=false;ui.note='';
    const rp=($('#repo')?$('#repo').value.trim():'')||localStorage.getItem('lv.repo')||st.repo;
    const typed=$('#tok')?$('#tok').value.trim():'';
    const cands=[];
    if(typed)cands.push(typed);
    const stored=localStorage.getItem('lv.tok');
    if(stored){try{cands.push(dec.decode(await decB(key,stored,'lv-token')))}catch(e){}}
    let vt='';
    if(f.tok){try{vt=dec.decode(await decB(key,f.tok,'lv-token'));cands.push(vt)}catch(e){}}
    let tok='',tried=false;
    if(repoOk(rp)){
      for(const c of [...new Set(cands)]){
        tried=true;st.repo=rp;st.token=c;
        try{
          const rem=await fetchRemote();
          if(!rem)throw new Error('missing');
          S=rem.data;st.sha=rem.sha;st.canWrite=true;tok=c;break;
        }catch(e){st.token=''}
      }
    }
    if(st.canWrite){
      localStorage.setItem('lv.tok',await encB(key,enc.encode(tok),'lv-token'));
      localStorage.setItem('lv.repo',rp);
    }else if(tried)ui.note='Couldn’t reach GitHub with that token — opened read-only.';
    enterApp();
    if(st.canWrite&&vt!==tok)save(); // first time on a device that has the token: copy it (encrypted) into the vault
  }catch(e){gerr('Something went wrong. Please try again.')}
  finally{busy(false)}
}
async function create(){
  const repo=$('#repo').value.trim(),tok=$('#tok').value.trim(),pass=$('#pw').value;
  if(!repoOk(repo))return gerr('Enter the repo as owner/name.');
  if(!tok)return gerr('Paste your GitHub token.');
  if(pass.length<14)return gerr('Passphrase must be at least 14 characters.');
  busy(true);gerr('');
  try{
    st.repo=repo;st.token=tok;st.iter=ITER;
    const salt=rnd(16);st.salt=b64(salt);
    st.key=await derive(pass,salt,ITER);
    S={items:[],updated:Date.now()};
    const r=await GH('vault.json',{method:'PUT',body:JSON.stringify({message:'vault update',content:btoa(JSON.stringify(await sealFile(S)))})});
    if(r.status===422)return gerr('A vault already exists in this repo. Reload this page and unlock it instead.');
    if(r.status===401||r.status===403||r.status===404)return gerr('GitHub rejected the token or repo name (the token needs Contents: read & write on that repo).');
    if(!r.ok)return gerr('GitHub error '+r.status+'.');
    st.sha=(await r.json()).content.sha;st.canWrite=true;ui.note='';
    localStorage.setItem('lv.tok',await encB(st.key,enc.encode(tok),'lv-token'));
    localStorage.setItem('lv.repo',repo);
    enterApp();
  }catch(e){gerr('Something went wrong — check your connection and try again.')}
  finally{busy(false)}
}
function enterApp(){
  $('#gate').hidden=true;$('#appbody').hidden=false;
  stat(st.canWrite?'Encrypted & saved to GitHub ✓':(ui.note||'Read-only on this device'));
  render();bump();
  if(pendingAdd)showAdd();
}
async function lock(){
  clearTimeout(timer);
  if(dirty)saving=saving.then(push);
  await saving;
  if(dirty&&!confirm('Some changes could not be sent to GitHub. Lock anyway?'))return;
  location.reload();
}
let idle;
function bump(){clearTimeout(idle);if(st.key)idle=setTimeout(lock,15*60*1000)}
['click','keydown','touchstart'].forEach(t=>document.addEventListener(t,bump,{passive:true}));
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('error',e=>{if(e.target&&e.target.tagName==='IMG')e.target.remove()},true); // broken picture -> letter avatar
st.repo=localStorage.getItem('lv.repo')||detectRepo();
window.name='linkvault';
window.addEventListener('hashchange',()=>{readHash();if(st.key&&pendingAdd)showAdd()});
readHash();
boot();
})();
</script>
